<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi-Shop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            margin: 0;
            font-size: 36px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .product {
            border-bottom: 1px solid #eee;
            padding: 20px 0;
        }
        .product:last-child {
            border-bottom: none;
        }
        h2 {
            color: #2c3e50;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Kimi-Shop</h1>
        <p>Унікальні речі ручної роботи</p>
    </header>

    <div class="container">
        <h2>Наші товари</h2>
        
        <div class="product">
            <h3>Полігональні дерев'яні панно</h3>
            <p>Стильний та сучасний декор для вашого дому. Зроблено з натурального дерева.</p>
        </div>

        <div class="product">
            <h3>Побутові речі та декор</h3>
            <p>Тут незабаром з'являться інші корисні та красиві речі для вашого затишку.</p>
        </div>
    </div>

    <footer>
        &copy; 2024 Kimi-Shop. Зроблено з любов'ю.
    </footer>

</body>
</html>
