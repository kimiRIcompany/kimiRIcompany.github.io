<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miRI-Glue | miRI-shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; line-height: 1.5; }
        
        /* Шапка сайту */
        header { background: linear-gradient(135deg, #1e1e1e, #2a2a2a); text-align: center; padding: 50px 20px; border-bottom: 2px solid #8e44ad; }
        header h1 { font-size: 36px; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
        header p { color: #a0a0a0; margin-top: 10px; font-size: 16px; }

        /* Картка товару */
        .container { max-width: 500px; margin: -20px auto 40px; padding: 0 20px; }
        .card { background: #1e1e1e; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Фото */
        .card img { width: 100%; height: 300px; object-fit: cover; }
        
        /* Контент */
        .content { padding: 25px; }
        .product-title { font-size: 26px; color: #fff; margin-bottom: 5px; }
        .price { font-size: 22px; font-weight: bold; color: #2ecc71; margin-bottom: 20px; display: block; }
        
        /* Блоки з перевагами */
        .features { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .feature { background: #2a2a2a; padding: 12px 15px; border-radius: 10px; font-size: 14px; display: flex; align-items: center; }
        .feature span { color: #8e44ad; font-size: 18px; margin-right: 10px; }

        /* Блок про клей */
        .glue-info { background: rgba(142, 68, 173, 0.1); padding: 15px; border-radius: 10px; border-left: 4px solid #8e44ad; font-size: 14px; color: #ccc; }
        .glue-info b { color: #fff; display: block; margin-bottom: 5px; }

        footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>miRI-shop</h1>
        <p>Стильні речі для твого дому</p>
    </header>

    <div class="container">
        <div class="card">
            <!-- Фото -->
            "https://share.google/UqpsUj0BX37c3CxD6" 

            <div class="content">
                <h2 class="product-title">Термопістолет miRI-Glue</h2>
                <span class="price">349 грн</span>
                
                <div class="features">
                    <div class="feature"><span>⚡</span> Нагрів за лічені секунди</div>
                    <div class="feature"><span>🛡️</span> Безпечний та надійний корпус</div>
                    <div class="feature"><span>🎛️</span> Зручні кнопки налаштування</div>
                </div>

                <div class="glue-info">
                    <b>Про клей:</b>
                    Міцний, швидкий та приємний у використанні. Тримає намертво!
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2024 miRI-shop
    </footer>

</body>
</html>
